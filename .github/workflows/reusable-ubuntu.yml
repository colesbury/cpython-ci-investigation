name: Reusable Ubuntu

on:
  workflow_call:
    inputs:
      bolt-optimizations:
        description: Whether to enable BOLT optimizations
        required: false
        type: boolean
        default: false
      free-threading:
        description: Whether to use free-threaded mode
        required: false
        type: boolean
        default: false
      os:
         description: OS to run the job
         required: true
         type: string
      test-opts:
         description: Extra options to pass to the test runner via TESTOPTS
         required: false
         type: string
         default: ''

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  build-ubuntu-reusable:
    name: build and test (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      OPENSSL_VER: 3.5.6
      PYTHONSTRICTEXTENSIONBUILD: 1
      TERM: linux
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Register gcc problem matcher
      run: echo "::add-matcher::.github/problem-matchers/gcc.json"
    - name: Install dependencies
      run: sudo ./.github/workflows/posix-deps-apt.sh
    - name: Install monitoring tools
      run: sudo apt-get install -y sysstat
    - name: Install Clang and BOLT
      if: ${{ fromJSON(inputs.bolt-optimizations) }}
      run: |
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" ./llvm.sh 19
        sudo apt-get install --no-install-recommends bolt-19
        echo PATH="$(llvm-config-19 --bindir):$PATH" >> $GITHUB_ENV
    - name: Configure OpenSSL env vars
      run: |
        echo "MULTISSL_DIR=${GITHUB_WORKSPACE}/multissl" >> "$GITHUB_ENV"
        echo "OPENSSL_DIR=${GITHUB_WORKSPACE}/multissl/openssl/${OPENSSL_VER}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/multissl/openssl/${OPENSSL_VER}/lib" >> "$GITHUB_ENV"
    - name: 'Restore OpenSSL build'
      id: cache-openssl
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ./multissl/openssl/${{ env.OPENSSL_VER }}
        key: ${{ inputs.os }}-multissl-openssl-${{ env.OPENSSL_VER }}
    - name: Install OpenSSL
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: python3 Tools/ssl/multissltests.py --steps=library --base-directory "$MULTISSL_DIR" --openssl "$OPENSSL_VER" --system Linux
    - name: Setup directory envs for out-of-tree builds
      run: |
        echo "CPYTHON_RO_SRCDIR=$(realpath -m "${GITHUB_WORKSPACE}"/../cpython-ro-srcdir)" >> "$GITHUB_ENV"
        echo "CPYTHON_BUILDDIR=$(realpath -m "${GITHUB_WORKSPACE}"/../cpython-builddir)" >> "$GITHUB_ENV"
    - name: Create directories for read-only out-of-tree builds
      run: mkdir -p "$CPYTHON_RO_SRCDIR" "$CPYTHON_BUILDDIR"
    - name: Bind mount sources read-only
      run: sudo mount --bind -o ro "$GITHUB_WORKSPACE" "$CPYTHON_RO_SRCDIR"
    - name: Runner image version
      run: echo "IMAGE_OS_VERSION=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"
    - name: Configure CPython out-of-tree
      working-directory: ${{ env.CPYTHON_BUILDDIR }}
      # `test_unpickle_module_race` writes to the source directory, which is
      # read-only during builds — so we exclude it from profiling with BOLT.
      run: >-
        PROFILE_TASK='-m test --pgo --ignore test_unpickle_module_race'
        ../cpython-ro-srcdir/configure
        --config-cache
        --with-pydebug
        --enable-slower-safety
        --enable-safety
        --with-openssl="$OPENSSL_DIR"
        ${{ fromJSON(inputs.free-threading) && '--disable-gil' || '' }}
        ${{ fromJSON(inputs.bolt-optimizations) && '--enable-bolt' || '' }}
    - name: Build CPython out-of-tree
      if: ${{ inputs.free-threading }}
      working-directory: ${{ env.CPYTHON_BUILDDIR }}
      run: make -j
    - name: Build CPython out-of-tree (for compiler warning check)
      if: ${{ !inputs.free-threading }}
      working-directory: ${{ env.CPYTHON_BUILDDIR }}
      run: set -o pipefail; make -j --output-sync 2>&1 | tee compiler_output_ubuntu.txt
    - name: Display build info
      working-directory: ${{ env.CPYTHON_BUILDDIR }}
      run: make pythoninfo
    - name: Check compiler warnings
      if: ${{ !inputs.free-threading }}
      run: >-
        python Tools/build/check_warnings.py
        --compiler-output-file-path="${CPYTHON_BUILDDIR}/compiler_output_ubuntu.txt"
        --warning-ignore-file-path "${GITHUB_WORKSPACE}/Tools/build/.warningignore_ubuntu"
        --compiler-output-type=gcc
        --fail-on-regression
        --fail-on-improvement
        --path-prefix="../cpython-ro-srcdir/"
    - name: Remount sources writable for tests
      # some tests write to srcdir, lack of pyc files slows down testing
      run: sudo mount "$CPYTHON_RO_SRCDIR" -oremount,rw
    - name: Start resource monitor
      run: |
        MON="$RUNNER_TEMP/monitoring"
        mkdir -p "$MON"

        # sar: 5s interval, all metrics, binary log we'll convert later.
        nohup sar -o "$MON/sar.bin" -A 5 0 \
          >"$MON/sar.stdout" 2>"$MON/sar.stderr" &
        echo $! > "$MON/sar.pid"

        # Human-readable snapshot every 15s: free, loadavg, meminfo summary.
        nohup bash -c '
          while :; do
            printf "=== %s ===\n" "$(date -u +%FT%TZ)"
            free -m
            cat /proc/loadavg
            grep -E "^(MemTotal|MemFree|MemAvailable|Buffers|Cached|Swap)" /proc/meminfo
            echo
            sleep 15
          done
        ' > "$MON/snapshots.log" 2>&1 &
        echo $! > "$MON/snapshots.pid"

        # Tap dmesg for kernel events (OOM killer, etc.).
        sudo nohup dmesg --follow-new --time-format iso \
          > "$MON/dmesg.log" 2>&1 &
        echo $! | sudo tee "$MON/dmesg.pid" > /dev/null
    - name: Tests
      working-directory: ${{ env.CPYTHON_BUILDDIR }}
      env:
        TEST_OPTS: ${{ inputs.test-opts }}
        CPYTHON_FT_VERBOSE_LOG: ${{ runner.temp }}/ft-verbose.log
      run: |
        # Pre-create the test_free_threading side log so tail -F can attach
        # immediately. The worker writes per-method events here (see
        # Lib/test/test_free_threading/__init__.py).
        : > "$CPYTHON_FT_VERBOSE_LOG"

        # Background sampler whose output streams into THIS step's live log,
        # so it survives a runner shutdown / OOM kill (post-steps don't).
        (
          while :; do
            printf '\n### MON %s ###\n' "$(date -u +%FT%TZ)"
            free -m | sed -n '1,3p'
            echo "load: $(cat /proc/loadavg)"
            [ -r /proc/pressure/memory ] && \
              echo "psi/mem: $(grep some /proc/pressure/memory)"
            [ -r /proc/pressure/cpu ] && \
              echo "psi/cpu: $(grep some /proc/pressure/cpu)"
            [ -r /proc/pressure/io ] && \
              echo "psi/io:  $(grep some /proc/pressure/io)"
            ps --no-headers -eo rss,pid,comm --sort=-rss | head -8 \
              | awk '{printf "  %8s KB  pid=%-6s  %s\n",$1,$2,$3}'
            ps --no-headers -eo pid --sort=-rss | head -3 | while read p; do
              cmd=$(tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null | cut -c1-240)
              [ -z "$cmd" ] && cmd="(gone)"
              printf "  cmd[pid=%s]: %s\n" "$p" "$cmd"
            done
            sleep 5
          done
        ) &
        MON=$!

        # Tail the test_free_threading verbose log into this step's stdout
        # with [FT] prefix. Streams to GHA in real time, so it survives a
        # runner shutdown the same way the sampler does.
        tail -F "$CPYTHON_FT_VERBOSE_LOG" 2>/dev/null | sed -u 's/^/[FT] /' &
        FT_TAIL=$!

        trap 'kill "$MON" "$FT_TAIL" 2>/dev/null || true' EXIT
        xvfb-run make ci EXTRATESTOPTS="${TEST_OPTS}"
    - name: Stop resource monitor and collect logs
      if: always()
      run: |
        MON="$RUNNER_TEMP/monitoring"
        # Stop samplers (ignore errors if they already exited).
        [ -f "$MON/sar.pid" ]       && kill "$(cat "$MON/sar.pid")"       || true
        [ -f "$MON/snapshots.pid" ] && kill "$(cat "$MON/snapshots.pid")" || true
        [ -f "$MON/dmesg.pid" ]     && sudo kill "$(cat "$MON/dmesg.pid")" || true

        # Convert sar binary to text + CSV for off-runner analysis.
        sar -A -f "$MON/sar.bin" > "$MON/sar.txt" 2>&1 || true
        sadf -d "$MON/sar.bin" -- -A > "$MON/sar.csv" 2>&1 || true

        # Full final dmesg (in case the live tap missed wraparound) and kernel journal.
        sudo dmesg --ctime > "$MON/dmesg.final.txt" 2>&1 || true
        sudo journalctl -k --no-pager > "$MON/journal.kernel.txt" 2>&1 || true

        # Final state snapshot.
        {
          printf "=== final %s ===\n" "$(date -u +%FT%TZ)"
          free -m; echo
          df -h;  echo
          uptime
        } > "$MON/final-state.txt"

        ls -la "$MON"
    - name: Upload monitoring artifact
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: monitoring-${{ inputs.os }}-ft${{ inputs.free-threading }}
        path: ${{ runner.temp }}/monitoring/
        if-no-files-found: warn
